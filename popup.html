<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=360">
<title>Claude Usage</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #D97757;
    --accent-light: #E8956F;
    --accent-dim: rgba(217,119,87,0.15);
  }

  [data-theme="dark"] {
    --bg: #1a1714;
    --bg-card: #241f1b;
    --bg-card-hover: #2c2622;
    --border: rgba(217,119,87,0.1);
    --text-primary: #f0e8e0;
    --text-secondary: #a89888;
    --text-muted: #6b5e52;
    --track: #332c26;
    --bar: #f0e8e0;
    --footer-text: #5a4e44;
    --status-low: #5cb87f;
    --status-mid: #e0b341;
    --status-high: #e8956f;
    --status-crit: #f06a6a;
  }

  [data-theme="light"] {
    --bg: #faf6f2;
    --bg-card: #ffffff;
    --bg-card-hover: #fef9f5;
    --border: rgba(217,119,87,0.15);
    --text-primary: #2c1e12;
    --text-secondary: #7a6555;
    --text-muted: #b8a698;
    --track: #efe7df;
    --bar: #2c1e12;
    --footer-text: #c4b5a5;
    --status-low: #2f8452;
    --status-mid: #a37b12;
    --status-high: #c4613f;
    --status-crit: #c53030;
  }

  body {
    width: 360px;
    min-height: 200px;
    font-family: 'Söhne', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* The stored theme is read asynchronously, so stay blank until it is
     applied rather than flashing the wrong theme. The animation is a failsafe:
     if the script never runs, the body still appears shortly after, instead of
     leaving a permanently empty popup. */
  body { opacity: 0; animation: reveal 0s linear 0.5s forwards; }
  html.ready body { opacity: 1; animation: none; transition: opacity 0.12s ease, background 0.3s, color 0.3s; }
  @keyframes reveal { to { opacity: 1; } }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #D97757, #c4613f);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff;
  }
  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .icon-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); padding: 6px; border-radius: 6px;
    transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { color: var(--accent); background: var(--accent-dim); }
  .icon-btn:disabled { cursor: default; }
  .icon-btn:disabled:hover { color: var(--text-muted); background: none; }
  .icon-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cards { padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    transition: background 0.3s, border-color 0.3s;
  }
  .card:hover { background: var(--bg-card-hover); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .card-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
  }
  .card-value {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--track);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  /* Bars are always tinted; the number only takes on colour once usage is
     worth reacting to, so the common case stays calm. */
  .status-low .progress-fill { background: var(--status-low); }
  .status-mid .progress-fill { background: var(--status-mid); }
  .status-high .progress-fill { background: var(--status-high); }
  .status-crit .progress-fill { background: var(--status-crit); }

  .status-low .card-value,
  .status-mid .card-value { color: var(--text-primary); }
  .status-high .card-value { color: var(--status-high); }
  .status-crit .card-value { color: var(--status-crit); }

  /* Extra usage is prepaid money rather than a plan limit, so it is marked
     off with an accent edge. */
  .card-extra { border-left: 2px solid var(--accent); }
  .card-note {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }

  /* The credit balance sits under the limit it backs, set off but clearly
     part of the same card. */
  .card-sub {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .card-sub-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .card-sub-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
  }
  .card-sub-value { font-size: 11px; color: var(--text-secondary); }
  .card-sub-value.strong { font-size: 15px; font-weight: 700; color: var(--text-primary); }
  .card-warn {
    margin-top: 8px;
    font-size: 11px;
    font-weight: 600;
    color: var(--status-crit);
  }
  .progress-track.thin { height: 4px; }
  .progress-track.thin .progress-fill { background: var(--accent); }

  .reset-info {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .reset-info svg { flex-shrink: 0; }
  .reset-icon { display: flex; flex-shrink: 0; }

  .state-msg {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    gap: 12px;
  }
  .state-msg .icon { font-size: 32px; }
  .state-msg .title { font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .state-msg .desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
  .state-msg a { color: var(--accent); text-decoration: none; }
  .state-msg a:hover { text-decoration: underline; }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 16px 12px;
    font-size: 10px;
    color: var(--footer-text);
  }
  .auto-refresh {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .auto-refresh select {
    font: inherit;
    font-size: 10px;
    color: var(--text-secondary);
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 4px;
    cursor: pointer;
  }
  .auto-refresh select:focus { outline: 1px solid var(--accent); }
</style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <div class="logo" aria-hidden="true">C</div>
      <div class="header-title">Claude Usage</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="notifyBtn" title="Alerts" aria-label="Toggle usage alerts" aria-pressed="true">
        <svg id="bellOnIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <svg id="bellOffIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/><path d="M18.63 13A17.89 17.89 0 0 1 18 8"/><path d="M6.26 6.26A5.86 5.86 0 0 0 6 8c0 7-3 9-3 9h14"/><path d="M18 8a6 6 0 0 0-9.33-5"/><line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg id="sunIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg id="moonIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="icon-btn" id="refreshBtn" title="Refresh" aria-label="Refresh usage">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M2.5 22v-6h6"/>
          <path d="M2.5 11.5a10 10 0 0 1 18.4-4.5M21.5 12.5a10 10 0 0 1-18.4 4.5"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="content" role="status" aria-live="polite">
    <div class="state-msg">
      <div class="icon" aria-hidden="true">⏳</div>
      <div class="title">Loading…</div>
    </div>
  </div>

  <div class="footer">
    <span id="footerText">Data from claude.ai • Local only</span>
    <label class="auto-refresh" title="How often usage is refreshed, in the popup and on the toolbar badge. 30s is as fast as Chrome allows background work.">
      Auto
      <select id="intervalSelect" aria-label="Auto-refresh interval"></select>
    </label>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
